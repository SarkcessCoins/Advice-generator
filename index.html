<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->
    <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png" />

    <title>Frontend Mentor | Advice generator app</title>

    <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="container">
      <h1 class="advice-title">Advice # <span id="adive-id"></span></h1>
      <div class="advice-card">
        <p class="advice-text" id="advice-text">" Advice text goes here"</p>
        <picture>
          <source srcset="images/pattern-divider-desktop.svg" media="(min-width: 40em)" />
          <img
            src="images/pattern-divider-mobile.svg"
            alt="Decorative divider with symmetrical lines and dots creating a centered pattern, providing visual separation in the advice card layout"
          />
        </picture>
      </div>
      <button class="generate-button"><img src="images/icon-dice.svg" /></button>
    </main>

    <footer class="attribution">
      Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. Coded by
      <a href="#">Success</a>.
    </footer>
  </body>
</html>
